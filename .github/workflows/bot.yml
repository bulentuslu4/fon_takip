name: FonTakip Telegram Bot

on:
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3
      
    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Gereksinimleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas tefas-crawler
        
    - name: Bildirim Botunu Çalıştır
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bildirim_bot.py
      
    - name: Güncel Fiyatları GitHub'a Kaydet (prices.json)
      run: |
        git config --global user.name "FonTakip Bot"
        git config --global user.email "bot@fontakip.local"
        git add prices.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Otomatik Güncelleme: Güncel Fon Fiyatları" && git push)
