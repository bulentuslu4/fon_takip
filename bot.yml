name: FonTakip Telegram Bot

on:
  schedule:
    # Her gün Türkiye saati ile 18:00'de çalışır (UTC 15:00)
    - cron: '0 15 * * 1-5'
  workflow_dispatch: # Manuel tetikleme butonu ekler

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3
      
    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Gereksinimleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas tefas-crawler
        
    - name: Bildirim Botunu Çalıştır
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bildirim_bot.py
